name: Build Minecraft BloxCloud.jar

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/BloxCloudPlugin.java'
      - 'sdk/minecraft/**'
      - '.github/workflows/build-minecraft-jar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare Maven source layout
        run: |
          mkdir -p sdk/minecraft/src/main/java/world/bloxcloud/plugin
          mkdir -p sdk/minecraft/src/main/resources
          cp sdk/BloxCloudPlugin.java sdk/minecraft/src/main/java/world/bloxcloud/plugin/BloxCloudPlugin.java
          cp sdk/minecraft/plugin.yml sdk/minecraft/src/main/resources/plugin.yml
          cp sdk/minecraft/config.yml sdk/minecraft/src/main/resources/config.yml

      - name: Build BloxCloud.jar with Maven
        working-directory: sdk/minecraft
        run: mvn -B clean package

      - name: Publish BloxCloud.jar to minecraft-latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minecraft-latest
          name: BloxCloud Minecraft Plugin (Latest)
          body: |
            Drop `BloxCloud.jar` directly into your Paper / Spigot / Purpur `/plugins/` folder, restart, and paste your Studio API Key into `plugins/BloxCloud/config.yml`.
          files: sdk/minecraft/target/BloxCloud.jar
          make_latest: true
